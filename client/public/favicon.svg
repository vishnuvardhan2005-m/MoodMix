<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient (Yellow to Orange) -->
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF000" />
      <stop offset="45%" stop-color="#FFB300" />
      <stop offset="85%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#E64A00" />
    </radialGradient>

    <!-- Music Note Gradient (Purple to Pink/Magenta) -->
    <linearGradient id="noteGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B0EAB" />
      <stop offset="35%" stop-color="#8012B7" />
      <stop offset="70%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
  </defs>

  <!-- Yellow/Orange Gradient Background Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" />

  <!-- 3D Shadow Layer -->
  <g transform="translate(12, 14)">
    <path fill="#000000" d="
      M 215, 125
      L 375, 75
      v 175
      c -12, -7 -28, -11 -46, -11
      c -36, 0 -66, 20 -66, 46
      c 0, 26 30, 46 66, 46
      c 36, 0 66, -20 66, -46
      V 155
      L 237, 185
      v 115
      c -12, -7 -28, -11 -46, -11
      c -36, 0 -66, 20 -66, 46
      c 0, 26 30, 46 66, 46
      c 36, 0 66, -20 66, -46
      V 125
      Z
      M 237, 125
      l 138, -43
      v 32
      l -138, 43
      Z
      M 237, 172
      l 138, -43
      v 28
      l -138, 43
      Z
    " opacity="0.95" />
  </g>

  <!-- Main Note with Purple/Magenta Gradient -->
  <g>
    <!-- Double Note Outer Silhouette with Stroke -->
    <path fill="url(#noteGrad)" stroke="#111111" stroke-width="7" stroke-linejoin="round" d="
      M 215, 125
      L 375, 75
      v 175
      c -12, -7 -28, -11 -46, -11
      c -36, 0 -66, 20 -66, 46
      c 0, 26 30, 46 66, 46
      c 36, 0 66, -20 66, -46
      V 155
      L 237, 185
      v 115
      c -12, -7 -28, -11 -46, -11
      c -36, 0 -66, 20 -66, 46
      c 0, 26 30, 46 66, 46
      c 36, 0 66, -20 66, -46
      V 125
      Z
    " />

    <!-- Top Connecting Beam 1 -->
    <path fill="url(#noteGrad)" stroke="#111111" stroke-width="6" stroke-linejoin="round" d="
      M 215, 125
      L 375, 75
      v 34
      L 215, 159
      Z
    " />

    <!-- Second Connecting Beam 2 -->
    <path fill="url(#noteGrad)" stroke="#111111" stroke-width="6" stroke-linejoin="round" d="
      M 215, 172
      L 375, 122
      v 28
      L 215, 200
      Z
    " />
  </g>
</svg>
